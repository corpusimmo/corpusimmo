name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push makes an in-flight run pointless : on annule plutôt que de payer.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck · Lint · Tests · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      # AUCUNE version ici, délibérément. `package.json` porte un champ
      # `packageManager`, et l'action REFUSE de démarrer quand les deux
      # sources se contredisent. Une version écrite dans le workflow serait
      # de toute façon une seconde vérité, qui finirait par diverger du
      # fichier de verrouillage : c'est lui qui commande.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Tests
        run: pnpm test

      # La construction doit passer avec un environnement VIDE : c'est le
      # contrat du projet, aucune clé n'est nécessaire pour servir de vraies
      # données DVF. Si cette étape réclame un jour un secret, c'est que
      # quelque chose a été branché à l'envers.
      - name: Build
        run: pnpm build
